<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ .Title }}</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="/static/main.js" defer></script>
    <script src="/static/utils.js" defer></script>

<body>
    <!-- {{ range .Body }}
        <p>{{ . }}</p>
    {{ end }} -->
    <nav class="navbar">
        <button id="theme-toggle">switch theme</button>
    </nav>
    <main class="main">
        <article id="fileList" class="grid-container">
            <form action="/search" method="POST" class="form flex column gap-3" id="search-form">
                <input class="" type="text" id="name" name="name" required placeholder="search">
                <div>
        </article>

        </div>
        <button class="primary" type="submit" id="submit">Submit</button>
        </form>
        <article id="fileList" class="grid-container">

            {{ range .Body }}
            <p>{{ . }}</p>
            {{ end }}


            {{ if .ListOfItems }}
            {{ range .ListOfItems }}    
            <p>{{ .Name }}</p>
            {{ end }}
            {{ end }}
            <!-- <form>
            <label for="like" class="">
                <input type="checkbox" id="like" name="like"/>
                Like 
            </label class="">
            <label for="dir">
                <input type="checkbox" id="dir" name="dir"/>
                Dir
            </label>
            <label for="keywords">
                <input type="checkbox" id="keywords" name="keywords"/>
                Keywords
            </label>
            </div>
            <button class="primary" type="submit" id="submit">Submit</button>
        </form> -->


            <ul id="list-headers" class="file-list headers">
                <li id="sort-name" data-sort-type="name" data-ascending="true">name</li>
                <li id="sort-size" data-sort-type="size" data-ascending="true">size</li>
                <li id="sort-date" data-sort-type="moddate" data-ascending="true">date</li>
            </ul>
            <!-- <p>{{ .Params }}</p> -->
            <ol id="list" class="file-list" type="1">

            </ol>
            <div id="button-container" class="button-container">
                <button class="primary" type="button"
                    hx-get="/append?name={{ .Params.Name }}&like={{ .Params.Like }}&limit={{ .Params.Limit }}&offset={{ .Params.Limit }}&dir={{ .Params.Dir }}&keywords={{ .Params.Keywords }}"
                    hx-target="#list" hx-swap="beforeend" hx-boost="true" hx-trigger="click" id="next">
                </button>
            </div>
        </article>
    </main>


</body>

</html>
