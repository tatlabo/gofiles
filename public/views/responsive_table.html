<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../../static/style.css">
</head>

<body>
    <h1>Responsive Table</h1>

    <table>
        <caption>opis tabeli</caption>
        <tr>
            <th>team</th>
            <th>wins</th>
            <th>losses</th>
            <th>mdt</th>
            <th>win / los</th>
            <th>Header 6</th>
        </tr>

    </table>
</body>

</html>



<script>
    const table = document.querySelector('table');

    const teams = ["Thunder", "Nuggets", "Spurs", "Rockets", "Lakers", "Timbewvolves", "Suns", "Trail Blazers", "Jazz", "Grizzlies", "Clippers", "Kings", "Mavericks", "Pelicans",]
    const wins = [12, 9, 8, 7, 8, 7, 8, 6, 7, 4, 4, 3, 3, 3, 2]
    const losses = [1, 2, 3, 3, 4, 4, 5, 5, 6, 8, 9, 8, 9, 9, 9]
    const mdt = ['-', 2.0, 3.0, 3.5, 3.5, 4.0, 4.0, 5.0, 5.0, 7.5, 8.0, 8.0, 8.5, 8.5, 9.0]
    const winlos = [.923, .818, .727, .700, .667, .636, .615, .545, .538, .333, .308, .273, .250, .250, .182]


    const rows = [];

    teams.forEach((team, index) => {
        const row = document.createElement('tr');
        const cellFirst = document.createElement('td');
        cellFirst.dataset.cell = "team";
        const cellSecond = document.createElement('td');
        cellSecond.textContent = wins[index];
        const cellThird = document.createElement('td');
        const cellFourth = document.createElement('td');
        const cellFifth = document.createElement('td');
        cellFirst.textContent = teams[index];
        cellSecond.textContent = wins[index];
        cellThird.textContent = losses[index];
        cellFourth.textContent = mdt[index];
        cellFifth.textContent = winlos[index];
        const cellSixth = document.createElement('td');
        cellSixth.textContent = Math.random().toFixed(3);
        cellFirst.dataset.cell, cellSecond.dataset.cell = "team", "wins"
        cellThird.dataset.cell = "losses"
        cellFourth.dataset.cell = "mdt"
        cellFifth.dataset.cell = "winlos"
        cellSixth.dataset.cell = "header6"

        row.appendChild(cellFirst);
        row.appendChild(cellSecond);
        row.appendChild(cellThird);
        row.appendChild(cellFourth);
        row.appendChild(cellFifth);
        row.appendChild(cellSixth);
        rows.push(row);
    });

    console.log(...rows);


    table.innerHTML = table.innerHTML + rows.map(row => row.outerHTML).join('');


</script>
